services:
  zosi-bridge:
    container_name: zosi-bridge
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      - CAMERAS_FILE=/data/cameras.json
      - GO2RTC_CONFIG=/go2rtc/go2rtc.yaml
      - GO2RTC_URL=${GO2RTC_URL:-http://zosi-go2rtc:1984}
    ports:
      - "127.0.0.1:${SNAPSHOT_SERVER_PORT:-1985}:${SNAPSHOT_SERVER_PORT:-1985}"
    volumes:
      - ./data:/data
      - ./go2rtc:/go2rtc
    healthcheck:
      test: ["CMD-SHELL", "test -s /go2rtc/go2rtc.yaml && test -s /data/cameras.json"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 3s
    networks:
      zosi_internal: {}
      zosi_net:
        ipv4_address: ${BRIDGE_MACVLAN_IP:-192.168.138.251}

  zosi-go2rtc:
    container_name: zosi-go2rtc
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    depends_on:
      zosi-bridge:
        condition: service_healthy
    # Uncomment for Intel/AMD VAAPI hardware transcoding (TRANSCODE_MODE=vaapi):
    # devices:
    #   - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:1984:1984"
      - "127.0.0.1:8554:8554"
    volumes:
      - ./go2rtc:/config
    networks:
      zosi_internal: {}
      zosi_net:
        ipv4_address: ${GO2RTC_MACVLAN_IP:-192.168.138.250}

networks:
  zosi_internal:
    driver: bridge
  zosi_net:
    external: true
